name: Build

on:
  push:
    branches:
      - master
      - release
  workflow_dispatch: 


jobs:
  static-inspect:
    name: Static Inspect
    runs-on: ubuntu-latest
    steps:
      - name: Runner checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        id: deps-static-inspect
        run: |
          pip install ruff mypy bandit
          pip install -r requirements.txt

      - name: Run inspection
        id: static-inspection
        run: |
          ruff check --fix .
          mypy .
          bandit -r . -ll -s B201,B104
          pytest

  build:
    name: Build
    needs: static-inspect
    runs-on: ubuntu-latest
    steps:
      - name: Runner checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          APP_NAME=$(jq -r '.name' app-version.json)
          APP_VERSION=$(jq -r '.version' app-version.json)

          docker build -t "$APP_NAME:$APP_VERSION" . 

  inspect:
    name: SonarQube Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Runner checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        id: deps-coverage
        run: |
          pip install pytest pytest-cov coverage

      - name: Execute tests
        id: cov-report
        run: |
          pytest --cov=src --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}