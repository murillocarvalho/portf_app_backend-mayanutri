name: Python CI

on:
  push:
    branches:
      - master
      - release
  workflow_dispatch: 


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Runner checkout
        uses: actions/checkout@v4

      - name: Check dependencies
        id: deps-check
        run: |
          pip install poetry
          poetry install

      - name: Static inspection
        id: static-inspection
        run: |
          set -o pipefail
          poetry run ruff check . | sed 's/All checks passed!/Ruff analyses: All checks passed!/'
          poetry run mypy .
          echo "mypy: All checks passed!"
          poetry run bandit -r src tests -ll -s B201,B104
          echo "Bandit: All checks passed!"

  inspect:
    name: Inspect
    needs: build
    runs-on: self-hosted
    steps:
      - name: Runner checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        id: deps-coverage
        run: |
          poetry install

      - name: Execute tests
        id: cov-report
        run: |
          poetry run pytest --cov=src --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  publish:
    name: Publish
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest