name: Build

on:
  push:
    branches:
      - master
      - release


jobs:
  static-inspect:
    name: Static Inspect
    runs-on: ubuntu-latest
    steps:
      - name: Runner checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        id: install
        run: |
          pip install ruff
          pip install mypy
          pip install bandit
          pip install -r requirements.txt

      - name: Run inspection
        id: static-inspection
        run: |
          ruff check --fix .
          mypy .
          bandit -r . -ll -s B201,B104

  build:
    name: Build
    needs: static-inspect
    runs-on: ubuntu-latest
    steps:
      - name: Runner checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          APP_NAME=$(jq -r '.name' app-version.json)
          APP_VERSION=$(jq -r '.version' app-version.json)

          docker build -t "$APP_NAME:$APP_VERSION" . 