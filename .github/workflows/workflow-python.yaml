name: Build

on:
  push:
    branches:
      - master
      - release
  workflow_dispatch: 


jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Runner checkout
        uses: actions/checkout@v4

      - name: Check dependencies
        id: deps-check
        run: |
          pip install poetry
          poetry install

      - name: Static inspection
        id: static-inspection
        run: |
          set -o pipefail
          poetry run ruff check . | sed 's/All checks passed!/Ruff analyses: All checks passed!/'
          poetry run mypy .
          echo "mypy: All checks passed!"
          poetry run bandit -r src tests -ll -s B201,B104
          echo "Bandit: All checks passed!"

  inspect:
    name: Inspect
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Runner checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        id: deps-coverage
        run: |
          pip install poetry
          poetry install

      - name: Execute tests
        id: cov-report
        run: |
          poetry run pytest --cov=src --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube project link
        if: always()
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          project_url="${SONAR_HOST_URL%/}/dashboard?id=portf-backend-mayanutri"
          echo "SonarQube project: $project_url"
          printf '[Open project in SonarQube](%s)\n' "$project_url" >> "$GITHUB_STEP_SUMMARY"